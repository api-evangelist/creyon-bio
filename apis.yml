name: Creyon Bio
description: >-
  Creyon Bio (branded Creyon) is a San Diego drug-development company operating an
  AI-powered nucleic acid engineering platform, NucleIQ, that designs oligonucleotide
  and RNA therapies with tissue- and cell-specific delivery. Creyon uses aptamer-based
  delivery, lipid nanoparticles, and transferrin-receptor aptamers to cross the
  blood-brain barrier, targeting immunology, central nervous system (CNS), and
  neuromuscular indications including late-onset Pompe disease. The company is a
  venture-backed portfolio company of DCVC and currently advances three wholly-owned
  programs. This profile is a company/identity record in the API Evangelist network;
  Creyon publishes no public developer API, SDKs, or API documentation.
